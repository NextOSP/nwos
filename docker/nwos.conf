[options]
addons_path = /opt/nwos/addons,/opt/nwos/nwos/addons
data_dir = /var/lib/nwos
db_host = db
db_port = 5432
db_user = nwos
db_password = nwos
; leave empty so the database manager / dbfilter picks the database
db_name =
db_maxconn = 64
; master password for /web/database/manager - CHANGE THIS
admin_passwd = change-me-please
http_interface = 0.0.0.0
http_port = 9600
gevent_port = 9601
log_level = info
logfile = None
proxy_mode = True
list_db = True
workers = 4
max_cron_threads = 1
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
