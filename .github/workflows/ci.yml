name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  sanity:
    name: Sanity checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libjpeg-dev \
            libldap2-dev \
            libpq-dev \
            libsasl2-dev \
            libxml2-dev \
            libmagic1 \
            libxslt1-dev \
            postgresql-client \
            zlib1g-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install -r requirements.txt
          python -m pip install -r docker/requirements-extra.txt

      - name: Verify CLI starts
        run: |
          python ./nwos-bin --help
          python ./nwos-bin server --help

      - name: Check README image links
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          readme = pathlib.Path("README.md")
          missing = []
          for target in re.findall(r"!\[[^\]]*\]\(([^)]+)\)", readme.read_text()):
              if "://" in target or target.startswith("#"):
                  continue
              path = pathlib.Path(target)
              if not path.exists():
                  missing.append(target)
          if missing:
              print("Missing README image targets:")
              for target in missing:
                  print(f"- {target}")
              sys.exit(1)
          PY

      - name: Check deployment YAML
        run: |
          python -m pip install PyYAML
          python - <<'PY'
          import pathlib
          import yaml

          files = [pathlib.Path("docker-compose.yml"), *sorted(pathlib.Path("k8s").glob("*.yaml"))]
          for path in files:
              with path.open() as stream:
                  list(yaml.safe_load_all(stream))
              print(f"valid yaml: {path}")
          PY

      - name: Check shell scripts
        run: |
          sh -n docker/entrypoint.sh
          sh -n scripts/backup-compose.sh
          sh -n scripts/restore-compose.sh

      - name: Compile NextBot files
        run: |
          python -m py_compile \
            addons/mail_bot/models/mail_bot.py \
            addons/mail_bot/tests/test_mail_bot_ai.py

  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: sanity

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/nextosp/nwos:latest
            ghcr.io/nextosp/nwos:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: container
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          envs: GITHUB_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd "${DEPLOY_PATH:-$HOME/nwos}"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            git fetch --prune origin master
            git reset --hard "$GITHUB_SHA"

            docker compose pull
            docker compose up -d --no-build --remove-orphans

            # apply schema/module changes for the deployed code
            docker compose run --rm web server -c /etc/nwos/nwos.conf \
                -d "${NWOS_DB_NAME:-nwos}" -u all --stop-after-init
            docker compose restart web cron

            docker image prune -f
        env:
          GITHUB_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://${{ secrets.DEPLOY_HEALTH_HOST }}/web/login" || echo 000)
            if [ "$code" = "200" ]; then echo "healthy"; exit 0; fi
            echo "attempt $i: $code"; sleep 10
          done
          echo "service did not become healthy"; exit 1
